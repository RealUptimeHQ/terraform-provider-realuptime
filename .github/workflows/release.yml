# Terraform Registry release flow (REA-226). Runs in the PUBLIC mirror repo
# RealUptimeHQ/terraform-provider-realuptime, never in the monorepo (the
# monorepo's CI is local-only; docs/ci.md). Triggered by a v* tag, which
# scripts/publish-terraform-provider.mjs --tag vX.Y.Z pushes.
#
# Secrets the mirror repo needs (owner/lead, vaulted in 1Password first):
#   GPG_PRIVATE_KEY  ASCII-armored private key whose public half is
#                    registered on registry.terraform.io
#   PASSPHRASE       its passphrase
name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
